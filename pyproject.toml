[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-suite"
version = "0.1.0"
description = "Antigravity Benchmarking Suite — offline golden path and evaluation pipeline"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bench-suite = "bench_suite.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bench_suite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
